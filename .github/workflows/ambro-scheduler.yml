name: Ambro Scheduled Poster

on:
  workflow_dispatch:

concurrency:
  group: ambro-x-scheduled-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checkout commit
        run: git log -1 --format='checked_out=%H committed_at=%cI subject=%s'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled poster
        run: npm run post:scheduled
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5' }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          OPENAI_IMAGE_SIZE: ${{ secrets.OPENAI_IMAGE_SIZE || '1024x1536' }}
          OPENAI_IMAGE_QUALITY: ${{ secrets.OPENAI_IMAGE_QUALITY || 'low' }}
          OPENAI_IMAGE_FORMAT: ${{ secrets.OPENAI_IMAGE_FORMAT || 'jpeg' }}
          OPENAI_IMAGE_COMPRESSION: ${{ secrets.OPENAI_IMAGE_COMPRESSION || 82 }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          SCHEDULER_TIME_ZONE: America/New_York
          SCHEDULER_SLOT_OFFSET_MINUTE: 7
